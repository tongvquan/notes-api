services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab123
      POSTGRES_DB: notes
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d notes"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: lab
      DB_PASSWORD: lab123
      DB_NAME: notes
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: